name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk LichVanNien.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LichVanNien-apk
          path: LichVanNien.apk
      # Bản mới nhất luôn có ở trang Releases (tải trên điện thoại được)
      - name: Publish release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest LichVanNien.apk --title "Lịch Vạn Niên (bản mới nhất)" --notes "Build từ commit ${GITHUB_SHA::7}"
      # Lưu APK vào nhánh apk-build
      - name: Push APK to apk-build branch
        run: |
          mkdir out && cp LichVanNien.apk out/ && cd out
          git init -q -b apk-build
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add LichVanNien.apk
          git commit -q -m "APK build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk-build
